name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e . pytest ruff mypy psutil
      - name: Lint
        run: python -m ruff check sohbat tests
      - name: Type check
        run: python -m mypy sohbat
      - name: Tests
        run: python -m pytest -q
